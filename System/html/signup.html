<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - STI Clinic Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body class="auth-page">
    <header class="site-header">
        <a class="brand" href="login.html" aria-label="STI Clinic Management System home">
            <img src="../PHOTO/STI LOGO.jpg" alt="STI logo">
            <span>STI Clinic Management System</span>
        </a>
    </header>

    <main class="auth-stage">
        <section class="auth-card signup-card" aria-labelledby="signup-title">
            <h1 id="signup-title">Sign up</h1>
            <form id="signup-form" novalidate>
                <div class="field-group">
                    <label for="signup-username">Username</label>
                    <input id="signup-username" name="username" type="text" autocomplete="username">
                </div>
                <div class="field-group">
                    <label for="signup-email">Email</label>
                    <input id="signup-email" name="email" type="email" autocomplete="email">
                </div>
                <div class="field-group">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" name="password" type="password" autocomplete="new-password">
                </div>
                <div class="field-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
                </div>
                <button class="primary-button signup-button" type="submit">Log In</button>
                <p class="auth-message" id="signup-message" role="status" aria-live="polite"></p>
            </form>
            <p class="account-link">Already have an account? <a href="login.html">Log in here</a></p>
        </section>
    </main>
    <script src="../js/auth.js"></script>
</body>
</html>
