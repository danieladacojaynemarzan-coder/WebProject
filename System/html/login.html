<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../CSS/login.css">
        <title>Login</title>
    </head>
    <body>
        <header class="BAR">
            <div class="LOGO_AND_TEXT">
                <div class="STI_LOGO">
                    <img src="../PHOTO/STI LOGO.jpg" alt="LOGO_HERE">
                </div>
                <div class="STI_TEXT">
                    <h1>STI CLINIC MANAGEMENT SYSTEM</h1>
                </div>
            </div>
        </header>

        <main class="BACKGROUND">
            <div class="LOGIN_BOX">
                <h2>Log In</h2>
                <form>
                    <label>
                        Username
                        <input type="email" placeholder="Enter your username" required>
                    </label>
                    <label>
                        Password
                        <input type="password" placeholder="Enter your password" required>
                    </label>
                    <div class="FORGOT_PASSWORD">
                        <a class="TEXT_BUTTON" href="#">Forgot password?</a>
                    </div>
                    <button class="LOGIN_BUTTON" type="submit" href="dashboard.html" >Login</button>
                    <div class="SIGNIN_REDIRECT">
                        <a class="TEXT_BUTTON" href="register.html">Not registered yet? Create an account</a>
                    </div>
                </form>
            </div>
        </main>

        <script src="../JS/login.js"></script>
    </body>
</html>
