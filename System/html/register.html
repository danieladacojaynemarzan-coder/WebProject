<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../CSS/register.css">
        <title>Register</title>
    </head>
    <body>
        <header class="BAR">
            <div class="LOGO_AND_TEXT">
                <div class="STI_LOGO">
                    <img src="../PHOTO/STI LOGO.jpg" alt="LOGO_HERE">
                </div>
                <div class="STI_TEXT">
                    <h1>STI CLINIC MANAGEMENT SYSTEM</h1>
                </div>
            </div>
        </header>

        <main class="BACKGROUND">
            <div class="LOGIN_BOX">
                <h2>Sign Up</h2>
                <form>
                    <label>
                        Username
                        <input type="text" placeholder="Enter your username" required>
                    </label>
                    <label>
                        Email
                        <input type="email" placeholder="Enter your email" required>
                    </label>
                    <label>
                        Password
                        <input type="password" placeholder="Enter your password" required>
                    </label>
                    <label>
                        Confirm Password
                        <input type="password" placeholder="Confirm your password" required>
                    </label>
                    <button class="LOGIN_BUTTON" type="submit" href="dashboard.html">Sign Up</button>
                    <div class="LOGIN_REDIRECT">
                        <a class="TEXT_BUTTON" href="login.html">Already have an account? Log in</a>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
